services:
  grafana:
    image: grafana/grafana-oss:${GRAFANA_VERSION:-13.0.2}
    restart: unless-stopped
    ports:
      # bound to localhost only; on the VPS Nginx is the public entry point
      - "127.0.0.1:3000:3000"
    environment:
      GF_SERVER_ROOT_URL: ${GF_SERVER_ROOT_URL:-http://localhost:3000}
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:?set it in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_DATABASE_TYPE: nosuchdb   # TEST: deliberately broken
    volumes:
      - grafana-data:/var/lib/grafana

volumes:
  grafana-data:
