services:
  grafana:
    image: grafana/grafana-oss:${GRAFANA_VERSION:-13.0.2}
    restart: unless-stopped
    ports:
      # bound to localhost only; on the VPS Nginx is the public entry point
      - "127.0.0.1:3000:3000"
    environment:
      GF_SERVER_ROOT_URL: ${GF_SERVER_ROOT_URL:-http://localhost:3000}
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:?set it in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"

      # Login with Keycloak (realm "trisatya", client "grafana").
      # Based on grafana.com/docs/grafana/latest/setup-grafana/configure-security/
      #   configure-authentication/keycloak/ ; roles come from a Keycloak
      #   "User Client Role" mapper that writes the grafana client's roles to
      #   a top-level "roles" claim. The local admin login stays as fallback.
      GF_AUTH_GENERIC_OAUTH_ENABLED: "true"
      GF_AUTH_GENERIC_OAUTH_NAME: Keycloak
      GF_AUTH_GENERIC_OAUTH_ALLOW_SIGN_UP: "true"
      GF_AUTH_GENERIC_OAUTH_CLIENT_ID: grafana
      GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET: ${GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET:?set it in .env}
      GF_AUTH_GENERIC_OAUTH_SCOPES: openid email profile offline_access
      GF_AUTH_GENERIC_OAUTH_USE_PKCE: "true"
      GF_AUTH_GENERIC_OAUTH_USE_REFRESH_TOKEN: "true"
      GF_AUTH_GENERIC_OAUTH_AUTH_URL: https://auth.trisatya.dev/realms/trisatya/protocol/openid-connect/auth
      GF_AUTH_GENERIC_OAUTH_TOKEN_URL: https://auth.trisatya.dev/realms/trisatya/protocol/openid-connect/token
      GF_AUTH_GENERIC_OAUTH_API_URL: https://auth.trisatya.dev/realms/trisatya/protocol/openid-connect/userinfo
      GF_AUTH_GENERIC_OAUTH_EMAIL_ATTRIBUTE_PATH: email
      GF_AUTH_GENERIC_OAUTH_LOGIN_ATTRIBUTE_PATH: preferred_username
      GF_AUTH_GENERIC_OAUTH_NAME_ATTRIBUTE_PATH: name
      GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_PATH: "contains(roles[*], 'admin') && 'Admin' || contains(roles[*], 'editor') && 'Editor' || 'Viewer'"
      GF_AUTH_SIGNOUT_REDIRECT_URL: https://auth.trisatya.dev/realms/trisatya/protocol/openid-connect/logout?post_logout_redirect_uri=https%3A%2F%2Fgrafana.trisatya.dev%2Flogin
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards/keycloak:ro

  # Metrics. Joins "observability" to scrape keycloak:9000 in keycloak-stack.
  prometheus:
    image: prom/prometheus:v3.16.0
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks: [default, observability]
    mem_limit: 512m

  # Logs store.
  loki:
    image: grafana/loki:3.7.9
    restart: unless-stopped
    command: ["-config.file=/etc/loki/config.yaml"]
    volumes:
      - ./loki/config.yaml:/etc/loki/config.yaml:ro
      - loki-data:/loki
    mem_limit: 512m

  # Log shipper: reads container logs from the Docker socket (read-only).
  alloy:
    image: grafana/alloy:v1.21.3
    restart: unless-stopped
    command: ["run", "--storage.path=/var/lib/alloy/data", "/etc/alloy/config.alloy"]
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy-data:/var/lib/alloy/data
    mem_limit: 256m

networks:
  # Shared with keycloak-stack; created once with `docker network create observability`.
  observability:
    external: true

volumes:
  grafana-data:
  prometheus-data:
  loki-data:
  alloy-data:
