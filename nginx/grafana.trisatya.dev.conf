# Symlinked from /etc/nginx/sites-enabled/ on the VPS.
#
# This file is the single source of truth, SSL included. Do not run
# `certbot --nginx` against it: certbot would edit the checkout on the VPS
# and the next deploy's `git reset --hard` would silently drop those edits.
# Renewal (`certbot renew`) only swaps the files under /etc/letsencrypt.
# Test locally with scripts/nginx-test.sh.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name grafana.trisatya.dev;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name grafana.trisatya.dev;

    ssl_certificate     /etc/letsencrypt/live/grafana.trisatya.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/grafana.trisatya.dev/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Grafana Live uses websockets
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}
