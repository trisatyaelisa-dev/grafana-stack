name: Check & Deploy

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate docker-compose.yml
        run: |
          cp .env.example .env
          docker compose config -q

      - name: Validate Nginx config
        run: |
          docker run --rm -v "$PWD/nginx:/etc/nginx/conf.d:ro" nginx:1.27-alpine nginx -t

      - name: Lint deploy script
        run: shellcheck scripts/deploy.sh

  deploy:
    needs: check
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - name: Setup SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Show which key and user are used (public info only)
        env:
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          echo "key fingerprint (expect SHA256:EnwjiJ+17E1Yxmh88C1+BgDBrnduFZ4DlFFfHyt08Zc):"
          ssh-keygen -y -f ~/.ssh/deploy_key | ssh-keygen -lf - || echo "deploy key is not a valid private key"
          echo "user length: ${#VPS_USER} (expect 8 for 'trisatya')"
          echo "known_hosts lines: $(grep -c . ~/.ssh/known_hosts)"

      - name: Deploy (health check + auto rollback on the VPS)
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          # strip stray spaces/newlines picked up when pasting secrets
          VPS_USER="$(printf '%s' "$VPS_USER" | tr -d '[:space:]')"
          VPS_HOST="$(printf '%s' "$VPS_HOST" | tr -d '[:space:]')"
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            "$VPS_USER@$VPS_HOST" "$GITHUB_SHA"
